name: .NET

on:
  push:
    branches:
      - '*'
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Aero

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore -c Release
    - name: Test
      run: dotnet test --no-build --verbosity normal -c Release

    - name: NuGet Login
      if: github.event_name != 'pull_request'
      uses: NuGet/login@v1
      id: login
      with:
        user: TMW
    - name: Publish FauFau NuGet
      if: github.event_name != 'pull_request'
      env:
        NUGET_DIRECTORY: Aero.Gen/bin/Release
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push $NUGET_DIRECTORY/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Run benchmarks
      run: cd Aero.UnitTests && dotnet run -c Release
    - id: get-comment-body
      run: |
        body=$(cat Aero.UnitTests/BenchmarkDotNet.Artifacts/results/Aero.UnitTests.Benchmarks.Reading-report-github.md)
        body="${body//'%'/'%25'}"
        body="${body//$'\n'/'%0A'}"
        body="${body//$'\r'/'%0D'}" 
        echo ::set-output name=body::$body
    - name: Commit Comment
      uses: peter-evans/commit-comment@v4
      with:
          body: |
            Benchmark result (use as a guide):
            ${{ steps.get-comment-body.outputs.body }}

    - name: Download previous benchmark data
      uses: actions/cache@v6
      with:
        path: ./cache
        key: ${{ runner.os }}-benchmark
    - name: Store benchmark result
      uses: benchmark-action/github-action-benchmark@v1
      if: github.event_name != 'pull_request'
      with:
        name: Benchmark.Net Benchmark
        tool: 'benchmarkdotnet'
        gh-pages-branch: benchmarkResults
        benchmark-data-dir-path: benchmarks
        output-file-path: Aero/Aero.UnitTests/BenchmarkDotNet.Artifacts/results/Aero.UnitTests.Benchmarks.Reading-report-full-compressed.json
        external-data-json-path: ./cache/benchmark-data.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: false
        skip-fetch-gh-pages: true
        comment-always: false
        # Show alert with commit comment on detecting possible performance regression
        alert-threshold: '400%'
        fail-on-alert: true
