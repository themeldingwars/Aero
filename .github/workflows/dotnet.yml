name: .NET

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

defaults:
  run:
    shell: bash
    working-directory: ./Aero

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: ${{ matrix.platform.name }} ${{ matrix.dotnet.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
        - { name: Linux, os: ubuntu-24.04 }
        - { name: Windows, os: windows-2025-vs2026 }
        dotnet:
        - { name: .NET 8, version: '8.0.x' }

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
        submodules: recursive

    - name: Setup ${{ matrix.dotnet.name }} SDK
      id: setup-dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ matrix.dotnet.version }}
    - name: Enforce SDK Version
      env:
        DOTNET_VERSION: ${{ steps.setup-dotnet.outputs.dotnet-version }}
      run: dotnet new globaljson --sdk-version "$DOTNET_VERSION" --force
    - name: Verify SDK Installation
      run: dotnet --info

    - name: Restore dependencies
      run: dotnet restore
    - name: Regenerate protocol files
      run: dotnet run --project Aero.ProtocolGen -c Release --no-restore
    - name: Verify protocol files are up to date
      run: git diff --exit-code -- Aero.Gen/Protocol
    - name: Build
      run: dotnet build --no-restore -c Release
    - name: Test
      run: dotnet test --no-build --verbosity normal -c Release

    # Every push to main publishes, nbgv only counts the commits that touch Aero.Gen, so a commit that only
    # changes tests, benchmarks or CI keeps the version that already has a tag
    - name: Check for a new version
      if: matrix.platform.name == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: version
      run: |
        dotnet tool install -g nbgv
        version=$(nbgv get-version -v NuGetPackageVersion)
        if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
          echo "v$version is already released"
          echo "publish=false" >> "$GITHUB_OUTPUT"
        else
          echo "Releasing v$version"
          echo "publish=true" >> "$GITHUB_OUTPUT"
        fi

    - name: NuGet Login
      if: steps.version.outputs.publish == 'true'
      uses: NuGet/login@v1
      id: login
      with:
        user: TMW
    - name: Publish Aero.Gen NuGet
      if: steps.version.outputs.publish == 'true'
      env:
        NUGET_DIRECTORY: Aero.Gen/bin/Release
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push "$NUGET_DIRECTORY"/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
    - name: Tag release
      if: steps.version.outputs.publish == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPOSITORY: ${{ github.repository }}
      run: |
        nbgv tag
        git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git" "v$(nbgv get-version -v NuGetPackageVersion)"

    - name: Run benchmarks
      if: matrix.platform.name == 'Linux'
      run: cd Aero.UnitTests && dotnet run -c Release
    - name: Download previous benchmark data
      if: matrix.platform.name == 'Linux'
      uses: actions/cache@v6
      with:
        path: ./cache
        key: ${{ runner.os }}-benchmark
    - name: Store benchmark result
      if: matrix.platform.name == 'Linux' && github.ref == 'refs/heads/main'
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: Benchmark.Net Benchmark
        tool: 'benchmarkdotnet'
        gh-pages-branch: benchmarkResults
        benchmark-data-dir-path: benchmarks
        output-file-path: Aero/Aero.UnitTests/BenchmarkDotNet.Artifacts/results/Aero.UnitTests.Benchmarks.Reading-report-full-compressed.json
        external-data-json-path: ./cache/benchmark-data.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: false
        skip-fetch-gh-pages: true
        comment-always: false
        # Show alert with commit comment on detecting possible performance regression
        alert-threshold: '400%'
        fail-on-alert: true
